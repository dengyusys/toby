# Server-side compose for a single Aliyun ECS (or any single VPS) deployment.
# Differences from the root compose.yaml:
#   - no build section: the image either comes from `docker load` (tarball
#     transfer, default) or from a registry pull (set TOBY_IMAGE in .env —
#     see docs/operations/deploy-ecs.md "Automated deployment")
#   - healthcheck probes "/" so it also verifies static serving;
#     /api/system/health would work too — it is exempt from authentication
#     by design (the Docker healthcheck target)
# 服务器端 compose(阿里云 ECS / 任意单台 VPS 通用)。与根 compose.yaml 的差异:
#   - 无 build 段:镜像默认来自 docker load(镜像包直传);
#     自动化部署时在 .env 里设置 TOBY_IMAGE 走仓库拉取,
#     见 docs/operations/deploy-ecs.zh.md "自动化部署"一节
#   - 健康检查探 "/" —— 顺带验证静态资源;探 /api/system/health 也可以,
#     该端点按设计豁免认证(就是给 Docker healthcheck 用的)
services:
  server:
    # Compose interpolates ${...} from the .env file next to this compose
    # file; without TOBY_IMAGE it falls back to the docker-load name.
    # compose 会从同目录 .env 读取该变量;未设置时回退为 docker load 的镜像名。
    image: ${TOBY_IMAGE:-toby:latest}
    container_name: toby
    ports:
      # Loopback only — the public internet cannot reach the port. Keep this
      # line for reverse-proxy (Caddy/nginx) setups; switch to "8629:8629"
      # for Tailscale/WireGuard access (still no security-group rule for 8629).
      # 只绑回环,公网摸不到。反代方案保持本行不变;Tailscale 组网时改为
      # "8629:8629"(安全组依然不放行 8629)。
      - "127.0.0.1:8629:8629"
    volumes:
      # Database files live in this folder on the server — back it up.
      # 数据库文件落在服务器本目录,备份就是备份这个文件夹。
      - ./data:/app/data
    environment:
      # The container must bind all interfaces; the port mapping above keeps
      # the exposure loopback-only.
      # 容器内必须绑 0.0.0.0,由端口映射负责只暴露回环。
      - TOBY_HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8629/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
