# Toby pnpm workspace: members, native build allowlist and the version
# catalog. Package.json files reference catalog versions with "catalog:" so
# every app and package builds against one tested combination (the version
# matrix in PLAN.md).
#
# Toby pnpm 工作区:成员、原生构建白名单与版本 catalog。各 package.json
# 以 "catalog:" 引用 catalog 版本,所有应用与包构建在同一套实测组合上
# (即 PLAN.md 的版本矩阵)。

packages:
  - apps/*
  - packages/*

# pnpm blocks postinstall scripts unless allowlisted below. better-sqlite3
# ships platform prebuilds inside its npm tarball (prebuilds/), so its install
# script (GitHub download -> local compile) is blocked on purpose: the bundled
# win32-x64/linux-x64 prebuilds load directly and no toolchain is needed.
# Git hooks install via the repo's own "prepare" script, so the package's
# redundant postinstall stays blocked too.
#
# pnpm 会阻止未列入白名单的 postinstall 脚本。better-sqlite3 的预编译
# 二进制随 npm 包发布(prebuilds/ 目录),其安装脚本(连 GitHub 下载 ->
# 本地编译)被有意阻断:内置预编译直接加载,无需工具链。Git 钩子由仓库
# 自身的 "prepare" 脚本安装,该包冗余的 postinstall 同样保持阻断。

allowBuilds:
  esbuild: true
  better-sqlite3: false
  simple-git-hooks: false
  # pi-ai transitive deps: @google/genai has no real postinstall (no-op
  # echoes + a prepare that only runs for git checkouts); protobufjs'
  # postinstall is a source-build leftover — the npm tarball ships its
  # prebuilt files, so neither script is needed at runtime.
  # pi-ai 的传递依赖:@google/genai 没有真正的 postinstall(no-op 回显 +
  # 仅 git 检出才运行的 prepare);protobufjs 的 postinstall 是源码构建
  # 残留 —— npm 包自带预构建产物,两者的脚本运行时都不需要。
  "@google/genai": false
  protobufjs: false
  # @swc/core's postinstall only verifies/downloads a native binding; the
  # platform packages (@swc/core-win32-x64-msvc, @swc/core-linux-x64-gnu,
  # ...) arrive as optionalDependencies, so the script stays blocked.
  # @swc/core 的 postinstall 只是校验/下载原生绑定;平台包
  # (@swc/core-win32-x64-msvc、@swc/core-linux-x64-gnu 等)已随
  # optionalDependencies 分发,脚本保持阻断。
  "@swc/core": false

# Version table for the whole workspace. Groups run web runtime -> web build
# -> server -> testing -> language & types; inside a group the core framework
# comes first, peripheral packages after.
#
# 全工作区版本表。分组顺序:前端运行时 → 前端构建 → 服务端 → 测试 →
# 语言与类型;组内核心框架在前,外围包在后。

catalog:
  # Web runtime — bundled into the two SPA apps. The shadcn stack
  # (cva / radix-slot / lucide / sonner) is pre-provisioned for upcoming
  # UI components (variants, asChild, icons, toasts); declare them in the
  # app package.jsons with "catalog:" when first imported.
  # 前端运行时 —— 打包进双 SPA 应用。shadcn 四件套
  # (cva / radix-slot / lucide / sonner)为即将到来的 UI 组件预置
  # (变体 / asChild / 图标 / toast);首次 import 时在各应用
  # package.json 里以 "catalog:" 声明即可。
  react: ^19.0.0
  react-dom: ^19.0.0
  react-router: ^8.3.1
  "@tanstack/react-query": ^5.104.1
  cn: ^0.3.0
  class-variance-authority: ^0.7.1
  "@radix-ui/react-slot": ^1.3.3
  lucide-react: ^1.33.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # Web build toolchain — Vite + Tailwind v4 + the shadcn CLI.
  # 前端构建工具链 —— Vite + Tailwind v4 + shadcn CLI。
  vite: ^6.0.0
  "@vitejs/plugin-react": ^4.3.4
  shadcn: ^4.19.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3

  # Server runtime — @toby/server only.
  # 服务端运行时 —— 仅 @toby/server 使用。
  # Exact-pinned to the copy @nestjs/platform-fastify resolves (5.12.7);
  # any other resolution splits Fastify types/instances in two.
  # 精确钉到 @nestjs/platform-fastify 解析的同一版本(5.12.7);
  # 任何其他解析都会让 Fastify 的类型与实例分裂成两份。
  fastify: 5.12.7
  "@fastify/static": ^10.1.3
  better-sqlite3: ^13.0.3
  mysql2: ^3.24.6

  # AI runtime (pi ecosystem) — pinned exact: pi-agent-core depends on exact
  # pi-ai 1.3.0 / typebox 1.3.27; a caret here would install a second copy of
  # pi-ai and split the Message/Context types across versions.
  # AI 运行时（pi 生态）—— 精确钉版:pi-agent-core 精确依赖 pi-ai 1.3.0 /
  # typebox 1.3.27;这里若用 ^ 会装出第二份 pi-ai,类型跨版本分叉。
  "@earendil-works/pi-ai": 1.3.0
  "@earendil-works/pi-agent-core": 1.3.0
  typebox: 1.3.27

  # Nest runtime — the server stack, over the same Fastify 5 engine.
  # Exact-pinned: a caret range resolves to the newest 12.x, which pnpm's
  # minimumReleaseAge gate rejects on release day (it auto-writes a
  # minimumReleaseAgeExclude bypass); upgrades are deliberate catalog edits.
  # Nest 运行时 —— 服务端技术栈,仍跑在 Fastify 5 引擎上。
  # 精确钉版:caret 范围会解析到最新的 12.x,发布当天被 pnpm 的
  # minimumReleaseAge 闸门拒绝(否则会自动写入 minimumReleaseAgeExclude
  # 绕过);升级时应有意地修改本表。
  "@nestjs/common": 12.2.0
  "@nestjs/core": 12.2.0
  "@nestjs/platform-fastify": 12.2.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.0
  "@nestjs/testing": 12.2.0
  "@nestjs/cli": ^12.0.10

  # Testing — vitest everywhere, DOM stack for the web apps.
  # 测试 —— vitest 全局使用,DOM 栈归前端应用。
  vitest: ^5.0.1
  "@vitest/coverage-v8": ^5.0.1
  unplugin-swc: ^2.0.0
  "@swc/core": ^1.16.20
  happy-dom: ^20.14.5
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/user-event": ^14.6.7

  # Language & type definitions.
  # 语言与类型定义。
  typescript: ~6.0.3
  "@types/node": ^22.0.0
  "@types/react": ~19.3.0
  "@types/react-dom": ^19.2.4
  "@types/better-sqlite3": ^9.6.0
