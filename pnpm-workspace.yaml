# Workspace members: server app, two web apps, shared packages.
# 工作区成员:服务端、双 Web 应用、共享包。
packages:
  - apps/*
  - packages/*

# Native build-script allowlist — pnpm blocks postinstall scripts unless listed here.
# 原生构建脚本白名单 —— 未列出的包 pnpm 会阻止其 postinstall 脚本。
# better-sqlite3 ships platform prebuilds inside its npm tarball (prebuilds/),
# so its install script (GitHub download -> local compile) is blocked on purpose:
# the bundled win32-x64/linux-x64 prebuilds load directly and no toolchain is needed.
# better-sqlite3 的预编译二进制随 npm 包发布(prebuilds/ 目录),其安装脚本
# (连 GitHub 下载 -> 本地编译)被有意阻断:内置预编译直接加载,无需工具链。
# Hooks install via the repo's own "prepare" script, so the package's redundant
# postinstall stays blocked.
# 钩子由仓库自身的 "prepare" 脚本安装,该包冗余的 postinstall 保持阻断。
allowBuilds:
  esbuild: true
  better-sqlite3: false
  simple-git-hooks: false
