# Toby pnpm workspace: members, native build allowlist and the version
# catalog. Package.json files reference catalog versions with "catalog:" so
# every app and package builds against one tested combination (the version
# matrix in PLAN.md).
#
# Toby pnpm 工作区:成员、原生构建白名单与版本 catalog。各 package.json
# 以 "catalog:" 引用 catalog 版本,所有应用与包构建在同一套实测组合上
# (即 PLAN.md 的版本矩阵)。

packages:
  - apps/*
  - packages/*

# pnpm blocks postinstall scripts unless allowlisted below. better-sqlite3
# ships platform prebuilds inside its npm tarball (prebuilds/), so its install
# script (GitHub download -> local compile) is blocked on purpose: the bundled
# win32-x64/linux-x64 prebuilds load directly and no toolchain is needed.
# Git hooks install via the repo's own "prepare" script, so the package's
# redundant postinstall stays blocked too.
#
# pnpm 会阻止未列入白名单的 postinstall 脚本。better-sqlite3 的预编译
# 二进制随 npm 包发布(prebuilds/ 目录),其安装脚本(连 GitHub 下载 ->
# 本地编译)被有意阻断:内置预编译直接加载,无需工具链。Git 钩子由仓库
# 自身的 "prepare" 脚本安装,该包冗余的 postinstall 同样保持阻断。

allowBuilds:
  esbuild: true
  better-sqlite3: false
  simple-git-hooks: false
  # pi-ai transitive deps: @google/genai has no real postinstall (no-op
  # echoes + a prepare that only runs for git checkouts); protobufjs'
  # postinstall is a source-build leftover — the npm tarball ships its
  # prebuilt files, so neither script is needed at runtime.
  # pi-ai 的传递依赖:@google/genai 没有真正的 postinstall(no-op 回显 +
  # 仅 git 检出才运行的 prepare);protobufjs 的 postinstall 是源码构建
  # 残留 —— npm 包自带预构建产物,两者的脚本运行时都不需要。
  "@google/genai": false
  protobufjs: false
# Version table for the whole workspace. Groups run web runtime -> web build
# -> server -> testing -> language & types; inside a group the core framework
# comes first, peripheral packages after.
#
# 全工作区版本表。分组顺序:前端运行时 → 前端构建 → 服务端 → 测试 →
# 语言与类型;组内核心框架在前,外围包在后。

catalog:
  # Web runtime — bundled into the two SPA apps. The shadcn stack
  # (cva / radix-slot / lucide / sonner) is pre-provisioned for upcoming
  # UI components (variants, asChild, icons, toasts); declare them in the
  # app package.jsons with "catalog:" when first imported.
  # 前端运行时 —— 打包进双 SPA 应用。shadcn 四件套
  # (cva / radix-slot / lucide / sonner)为即将到来的 UI 组件预置
  # (变体 / asChild / 图标 / toast);首次 import 时在各应用
  # package.json 里以 "catalog:" 声明即可。
  react: ^19.0.0
  react-dom: ^19.0.0
  react-router: ^8.3.1
  "@tanstack/react-query": ^5.104.1
  cn: ^0.3.0
  class-variance-authority: ^0.7.1
  "@radix-ui/react-slot": ^1.3.3
  lucide-react: ^1.33.0
  radix-ui: ^1.8.1
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0
  # Assistant-text Markdown rendering (chat + traces): react-markdown emits
  # React elements only (raw HTML is never rendered, no innerHTML), remark-gfm
  # adds tables/strikethrough/task lists, remark-breaks keeps single newlines
  # as line breaks so plain-text turns render as they did with pre-wrap.
  # 助手文本的 Markdown 渲染(chat + traces):react-markdown 只产出 React
  # 元素(原始 HTML 永不渲染,无 innerHTML),remark-gfm 补表格/删除线/
  # 任务列表,remark-breaks 把单个换行保留为换行,纯文本回合的观感与
  # 之前 pre-wrap 一致。
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  remark-breaks: ^4.0.0

  # Web build toolchain — Vite + Tailwind v4 + the shadcn CLI.
  # 前端构建工具链 —— Vite + Tailwind v4 + shadcn CLI。
  vite: ^8.0.0
  "@vitejs/plugin-react": ^6.0.0
  shadcn: ^4.19.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.5

  # Server runtime — @toby/server only.
  # 服务端运行时 —— 仅 @toby/server 使用。
  fastify: ^5.12.8
  "@fastify/cookie": ^11.1.5
  "@fastify/static": ^10.1.8
  better-sqlite3: ^13.0.3
  mysql2: ^3.24.6
  pino: ^10.4.0
  zod: ^4.6.7

  # AI runtime (pi ecosystem) — pinned exact: pi-agent-core depends on exact
  # pi-ai / pi-schema versions; a caret here would install a second copy and
  # split the Message/Context types across versions. Since pi 1.5.0 the pi
  # packages validate tool arguments with pi-schema (no TypeBox): tool
  # parameters are plain JSON Schema, so Zod's z.toJSONSchema output fits the
  # AgentTool type directly. pi-schema is also a direct dependency: the server
  # compiles each emitted tool schema at boot as a fail-fast self-check.
  # AI 运行时（pi 生态）—— 精确钉版:pi-agent-core 精确依赖 pi-ai / pi-schema;
  # 这里若用 ^ 会装出第二份副本,类型跨版本分叉。pi 1.5.0 起工具实参由
  # pi-schema 校验(不再用 TypeBox):工具参数就是纯 JSON Schema,Zod 的
  # z.toJSONSchema 产物可直接匹配 AgentTool 类型。pi-schema 同时是直接依赖:
  # 服务端在启动时逐个编译工具 schema,作为启动即败的自检。
  "@earendil-works/pi-ai": 1.5.0
  "@earendil-works/pi-agent-core": 1.5.0
  "@earendil-works/pi-schema": 1.5.0

  # Testing — vitest everywhere, DOM stack for the web apps.
  # 测试 —— vitest 全局使用,DOM 栈归前端应用。
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  happy-dom: ^20.14.5
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/user-event": ^14.6.7

  # Language & type definitions.
  # 语言与类型定义。
  typescript: ~6.0.3
  "@types/node": ^22.0.0
  "@types/react": ~19.3.0
  "@types/react-dom": ^19.2.4
  "@types/better-sqlite3": ^9.6.0

# pnpm 11 gates installs on minimumReleaseAge (1440 minutes by default): a
# caret range resolving to a release younger than the window is rejected.
# The exclude names this exact resolved version — whenever the catalog (or
# an update) moves to a different fastify, move the exclude in the same
# edit, or the gate rejects the install / pnpm auto-appends a new bypass.
# pnpm 11 默认按 minimumReleaseAge(1440 分钟)把关安装:caret 范围解析到
# 窗口期内的新发布时会被拒绝。排除项只放行指明的精确版本——catalog(或
# 更新)换到别的 fastify 时,必须在同一次修改里同步挪动排除项,否则闸
# 门拒绝安装,或 pnpm 自动追加新的绕过条目。
minimumReleaseAgeExclude:
  - fastify@5.12.8
